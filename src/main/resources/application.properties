spring.application.name=gerenciador-tarefas
server.port=8080

# Banco H2 salvo em arquivo (os dados sobrevivem a reinicializações)
spring.datasource.url=jdbc:h2:file:./data/tarefas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.thymeleaf.cache=false
